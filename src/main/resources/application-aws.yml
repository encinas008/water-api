# Application
server:
  port: ${SERVER_PORT:5000}

# Database
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db-dreamsbo.clptcbmsch2x.us-east-1.rds.amazonaws.com:5432/dreamsbo?currentSchema=pos}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: 'org.hibernate.dialect.PostgreSQLDialect'
        temp:
          use_jdbc_metadata_defaults: false
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2MB
      max-file-size: 5MB
      max-request-size: 10MB

# Security
security:
  authentication:
    jwt:
      secret: ${JWT_SECRET:c29tZXJhbmRvbWtleXdoaWNoaXNsb25nZW5vdWdodG9hbGlnbndpdGh0aGVqd3RzcGVjaWZpY2F0aW9u}
      token-validity-in-seconds: ${TOKEN_VALIDITY_IN_SECONDS:86400}
      token-validity-in-seconds-for-remember-me: ${REFRESH_TOKEN_VALIDITY_IN_SECONDS:604800}

# Cloud AWS
cloud:
  aws:
    enabled: ${AWS_ENABLED:false}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region:
      static: ${AWS_REGION:}
    stack:
      auto: false
    file:
      expiration-in-seconds: ${AWS_FILE_EXPIRATION_IN_SECONDS:604800}

application:
  bucket:
    name: ${AWS_BUCKET_NAME:pos-storage}

logging:
  level:
    org:
      springframework:
        web: debug

