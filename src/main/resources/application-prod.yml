# Application
server:
  port: 8085

# Database
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: 'org.hibernate.dialect.PostgreSQLDialect'
        temp:
          use_jdbc_metadata_defaults: false
        format_sql: true
        jdbc:
          time_zone: ${TIME_ZONE:UTC+4}
    show-sql: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2MB
      max-file-size: 5MB
      max-request-size: 10MB

# Security
security:
  authentication:
    jwt:
      secret: 'c29tZXJhbmRvbWtleXdoaWNoaXNsb25nZW5vdWdodG9hbGlnbndpdGh0aGVqd3RzcGVjaWZpY2F0aW9u'
      token-validity-in-seconds: ${TOKEN_VALIDITY_IN_SECONDS:86400}
      refresh-token-validity-in-seconds: ${REFRESH_TOKEN_VALIDITY_IN_SECONDS:604800}

# Cloud AWS
cloud:
  aws:
    enabled: ${AWS_ENABLED:false}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region:
      static: ${AWS_REGION:}
    stack:
      auto: false
    file:
      expiration-in-seconds: ${AWS_FILE_EXPIRATION_IN_SECONDS:604800}

# Images
images:
  client-application:
    path: ${IMAGES_CLIENT_APPLICATION_PATH}
  store:
    path: ${IMAGES_CLIENT_APPLICATION_STORE_PATH}
  access:
    path: ${IMAGES_CLIENT_APPLICATION_ACCESS_PATH}

application:
  bucket:
    name: 'pos-storage'

logging:
  level:
    org:
      springframework:
        web: info

expire:
  medical-histories:
    hours: ${EXPIRE_MEDICAL_HISTORY_IN_HOURS:24}
